[project]
name = "telegramtodobotreminder"
version = "0.1.0"
description = "Telegram bot for managing reminders"
readme = "README.md"
authors = [
    { name = "nekrosb", email = "makarov.nikita.mn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "aiosqlite>=0.21,<1",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
telegramtodobotreminder = "telegramtodobotreminder.main:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
